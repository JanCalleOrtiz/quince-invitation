
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Royal Rose Gold Quinceañera</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <section class="hero">

            <div class="hero-content">

                <p class="subtitle" data-i18n="welcome">
                    Welcome • Bienvenidos
                </p>

                <h1>Mis XV Años</h1>

               <p class="description">
                    Choose Your Language
                    <span class="spanish-instruction">
                        Elige Tu Idioma
                    </span>
                </p>

                <div class="language-buttons"
                     id="languageButtons">

                    <button type="button"
                            class="language-btn"
                            data-lang="en">
                        English
                    </button>

                    <button type="button"
                            class="language-btn"
                            data-lang="es">
                        Español
                    </button>

                </div>

                <button type="button"
                        id="openInvitation"
                        hidden
                        data-i18n="open">
                    Open Invitation
                </button>

            </div>

        </section>

        <section class="invitation-details"
                 id="invitationDetails"
                 hidden>

            <button type="button"
                    id="switchLanguage"
                    class="switch-language">
                English / Español
            </button>

            <div class="details-card">

                <p class="subtitle"
                   data-i18n="celebration">
                    A Royal Celebration
                </p>

                <h2>Mis XV Años</h2>

                <p data-i18n="invitationMessage">
                    You are cordially invited
                    to celebrate this special day.
                </p>

                <h3 data-i18n="dateHeading">
                    Date & Time
                </h3>
                <p data-i18n="datePlaceholder">
                    Date and time coming soon
                </p>

                <h3 data-i18n="locationHeading">
                    Location
                </h3>
                <p data-i18n="locationPlaceholder">
                    Venue details coming soon
                </p>

                <h3 data-i18n="rsvpHeading">
                    RSVP
                </h3>
                <p data-i18n="rsvpPlaceholder">
                    RSVP details coming soon
                </p>

            </div>

        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
